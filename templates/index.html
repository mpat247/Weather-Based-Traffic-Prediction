<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Traffic Congestion Predictor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card p-4">
            <h2 class="card-title text-center mb-4">
              Traffic Congestion Predictor
            </h2>
            <form method="post" action="/">
              <!-- Basic inputs -->
              <div class="mb-3">
                <label for="location" class="form-label"
                  >Location in Toronto</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="location"
                  name="location"
                  placeholder="e.g., Queen St West"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="temperature" class="form-label"
                  >Temperature (°C)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="temperature"
                  name="temperature"
                  placeholder="e.g., 10"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="wind_speed" class="form-label"
                  >Wind Speed (m/s)</label
                >
                <input
                  type="number"
                  step="0.1"
                  class="form-control"
                  id="wind_speed"
                  name="wind_speed"
                  placeholder="e.g., 2.5"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="hour" class="form-label">Hour (0–23)</label>
                <input
                  type="number"
                  class="form-control"
                  id="hour"
                  name="hour"
                  min="0"
                  max="23"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="day_of_week" class="form-label">Day of Week</label>
                <select
                  class="form-select"
                  id="day_of_week"
                  name="day_of_week"
                  required
                >
                  {% for day in days_of_week %}
                  <option value="{{ day }}">{{ day }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="mb-3">
                <label for="month" class="form-label">Month</label>
                <select class="form-select" id="month" name="month" required>
                  {% for month in month_options %}
                  <option value="{{ month }}">{{ month }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="mb-3">
                <label for="weather" class="form-label">Weather Summary</label>
                <select
                  class="form-select"
                  id="weather"
                  name="weather"
                  required
                >
                  {% for w in weather_options %}
                  <option value="{{ w }}">{{ w }}</option>
                  {% endfor %}
                </select>
              </div>

              <hr class="my-4" />

              <!-- New: Optional map layers -->
              <h5 class="mt-3">Optional Map Layers</h5>

              <!-- Traffic heat‑map -->
              <div class="mb-3">
                <label for="hour_heatmap" class="form-label">
                  Heat‑map hour 
                  <span id="hm_hour_val" class="badge bg-secondary">12</span>
                </label>
                <input
                  type="range"
                  class="form-range"
                  min="0"
                  max="23"
                  value="12"
                  id="hour_heatmap"
                  name="hour_heatmap"
                  oninput="hm_hour_val.innerText = this.value"
                />
              </div>
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="show_heatmap"
                  name="show_heatmap"
                />
                <label class="form-check-label" for="show_heatmap">
                  Show traffic heat‑map
                </label>
              </div>

              <!-- Collision hot‑spots -->
              <div class="row mb-2">
                <div class="col-md-6">
                  <label for="coll_radius" class="form-label">
                    Collision radius (m):
                    <span id="rad_val" class="badge bg-secondary">150</span>
                  </label>
                  <input
                    type="range"
                    class="form-range"
                    id="coll_radius"
                    name="coll_radius"
                    min="50"
                    max="300"
                    step="10"
                    value="150"
                    oninput="rad_val.innerText = this.value"
                  />
                </div>
                <div class="col-md-6 align-self-end">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="fatal_only"
                      name="fatal_only"
                    />
                    <label class="form-check-label" for="fatal_only">
                      Fatal only
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-check form-switch mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="show_collisions"
                  name="show_collisions"
                />
                <label class="form-check-label" for="show_collisions">
                  Show collision hot‑spots
                </label>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                  Predict & Draw Map
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
